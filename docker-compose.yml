services:
  influxdb:
    image: influxdb:2.7
    container_name: flashes-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./config/influxdb:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=flashes
      - DOCKER_INFLUXDB_INIT_BUCKET=flashes_data
      - DOCKER_INFLUXDB_INIT_RETENTION=0
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN} 
      - INFLUXDB_STORAGE_TSI_DISABLE_COMPACTION=true
    networks:
      - flashes-network

  mongodb:
    image: mongo:6.0
    container_name: flashes-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_DB_PATH=/data/db
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - flashes-network

  grafana:
    image: grafana/grafana
    container_name: flashes-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PLUGINS_PREINSTALL_SYNC=yesoreyeram-infinity-datasource@3.6.0
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - influxdb
      - backend
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./frontend/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./frontend/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./frontend/grafana/dashboards:/etc/grafana/dashboards
    networks:
      - flashes-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flashes-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - influxdb
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - flashes-network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flashes-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000   
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
     - ./frontend:/app
     - /app/node_modules
    networks:
      - flashes-network
networks:
  flashes-network:
    driver: bridge